<svg class="phase" viewBox="0 0 1000 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="phase-title phase-desc">
<title id="phase-title">Phase diagram of water with the path the flower takes</title>
<desc id="phase-desc">Pressure on a logarithmic axis against temperature. Three regions: ice, liquid water and vapour, meeting at the triple point at 0.01 degrees Celsius and 611.657 pascals. The flower is cooled at atmospheric pressure into the ice region, the pressure is lowered below the triple point, and as it warms the path crosses from ice straight into vapour without passing through liquid.</desc>
